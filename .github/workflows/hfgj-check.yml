name: HFGJ Invariant Check

on:
  push:
    branches:
      - hfgj
    paths:
      - 'package.json'
      - 'Cargo.lock'
      - 'src-tauri/**'
      - 'src/pages/settings.tsx'
      - 'src/components/setting/mods/update-viewer.tsx'
      - 'src/hooks/use-update.ts'
      - 'src/components/setting/setting-verge-advanced.tsx'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hfgj-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hfgj-check:
    if: >-
      !startsWith(github.event.head_commit.message || '', 'release(hfgj):') &&
      !startsWith(github.event.head_commit.message || '', 'chore(hfgj): sync upstream')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Verify HFGJ invariants
        run: node scripts/hfgj-check.mjs

      - name: Verify release artifact guards
        run: node --test scripts/hfgj-release.test.mjs
