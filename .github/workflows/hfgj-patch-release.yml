name: HFGJ Patch Release

on:
  push:
    branches:
      - hfgj
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - Cargo.lock
      - src-tauri/tauri.conf.json
      - '.github/workflows/hfgj-patch-release.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: hfgj-patch-release
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, 'release(hfgj):')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Verify version and release workflow
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hfgj-check.mjs
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq '.state')" = active
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-hfgj\.[0-9]+$ ]]; then
            echo "::error::Not an HFGJ stable version: $VERSION"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      publish: false
    secrets: inherit

  tag:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Tag the validated source
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hfgj
          test "$(git rev-parse origin/hfgj)" = "$SOURCE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
            test "$(git rev-list -n 1 "$TARGET_TAG")" = "$SOURCE_SHA"
          else
            git config user.name "hfgj-patch-release"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TARGET_TAG" "$SOURCE_SHA" -m "HFGJ release $TARGET_TAG"
            git push origin "refs/tags/$TARGET_TAG"
          fi

  publish:
    needs: [prepare, build, tag]
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      artifact_run_id: ${{ github.run_id }}
      publish: true
    secrets: inherit
