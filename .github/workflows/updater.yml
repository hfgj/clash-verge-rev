name: Updater CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional HFGJ release tag; empty selects newest published HFGJ release'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hfgj-updater-metadata
  cancel-in-progress: false

env:
  HUSKY: 0
  HFGJ_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}

jobs:
  release-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HFGJ branch
        uses: actions/checkout@v7
        with:
          ref: hfgj

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Update normal then Fixed WebView2 metadata
        run: |
          node scripts/updater.mjs
          node scripts/updater-fixed-webview2.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
