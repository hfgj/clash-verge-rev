name: Updater CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional HFGJ release tag; empty selects newest published HFGJ release'
        required: false
        type: string
  push:
    branches:
      - hfgj
    paths:
      - 'scripts/updater.mjs'
      - 'scripts/updater-fixed-webview2.mjs'
      - '.github/workflows/updater.yml'

permissions:
  contents: write

concurrency:
  group: hfgj-updater-metadata
  cancel-in-progress: false

env:
  HUSKY: 0
  HFGJ_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}

jobs:
  release-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HFGJ branch
        uses: actions/checkout@v7
        with:
          ref: hfgj

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i --frozen-lockfile

      - name: Release updater file
        run: pnpm updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-update-for-fixed-webview2:
    runs-on: ubuntu-latest
    needs: [release-update]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i --frozen-lockfile

      - name: Release updater file
        run: pnpm updater-fixed-webview2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
