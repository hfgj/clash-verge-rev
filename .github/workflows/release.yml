name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'HFGJ stable release tag'
        required: true
        type: string
      source_sha:
        description: 'Optional candidate SHA before promotion'
        type: string
      artifact_run_id:
        description: 'Reuse validated artifacts from this run'
        type: string
      publish:
        description: 'Publish the release and updater metadata'
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        default: ''
        type: string
      artifact_run_id:
        default: ''
        type: string
      publish:
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: hfgj-release-${{ inputs.release_tag }}-${{ inputs.publish }}
  cancel-in-progress: false

env:
  HUSKY: 0
  HFGJ_RELEASE_TAG: ${{ inputs.release_tag }}
  HFGJ_SOURCE_SHA: ${{ inputs.source_sha }}
  HFGJ_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
  HFGJ_PUBLISH: ${{ inputs.publish }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      rust_version: ${{ steps.prepare.outputs.rust_version }}
      build_required: ${{ steps.prepare.outputs.build_required }}
      already_published: ${{ steps.prepare.outputs.already_published }}
      core_version: ${{ steps.prepare.outputs.core_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Verify HFGJ invariants and artifact checks
        run: |
          node scripts/hfgj-check.mjs
          node --test scripts/hfgj-release.test.mjs
      - name: Resolve source and pinned stable core
        id: prepare
        run: node scripts/hfgj-release.mjs prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - variant: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - variant: windows-x64-fixed
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      HFGJ_STABLE_CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.rust_version }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hfgj-release-${{ matrix.target }}-${{ matrix.variant }}
          save-if: ${{ github.repository == 'hfgj/clash-verge-rev' && github.ref == 'refs/heads/hfgj' }}
          cache-workspace-crates: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare resources and frontend
        run: |
          pnpm i --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}
          pnpm run web:build
      - name: Run source regressions before packaging
        if: matrix.variant != 'windows-x64-fixed'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib proxy_chain_tests --target ${{ matrix.target }}
          cargo test --manifest-path src-tauri/Cargo.toml --lib hfgj_config_owned_tun_tests --target ${{ matrix.target }}
          cargo test --manifest-path src-tauri/Cargo.toml --lib package_urls_pin_the_resolved_version --target ${{ matrix.target }}
      - name: Download Fixed WebView2 runtime
        if: matrix.variant == 'windows-x64-fixed'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/133.0.3065.92/Microsoft.WebView2.FixedVersionRuntime.133.0.3065.92.x64.cab -OutFile webview2.cab
          expand.exe .\webview2.cab -F:* .\src-tauri
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 extraction failed' }
      - name: Configure package variant
        run: node scripts/hfgj-release.mjs configure ${{ matrix.variant }}
      - name: Build signed updater package
        run: pnpm build --target ${{ matrix.target }} --config "${{ github.workspace }}/.hfgj-build-config.json"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      - name: Collect assets and integrity manifest
        run: node scripts/hfgj-release.mjs collect ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: hfgj-${{ inputs.release_tag }}-${{ needs.prepare.outputs.source_sha }}-${{ matrix.variant }}
          path: release-artifacts/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && inputs.publish && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: hfgj-updater-metadata
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Download the validated packages
        if: needs.prepare.outputs.already_published != 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          pattern: hfgj-${{ inputs.release_tag }}-${{ needs.prepare.outputs.source_sha }}-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify integrity and publish release
        run: node scripts/hfgj-release.mjs publish
      - name: Update normal then Fixed WebView2 metadata
        run: |
          node scripts/updater.mjs
          node scripts/updater-fixed-webview2.mjs
